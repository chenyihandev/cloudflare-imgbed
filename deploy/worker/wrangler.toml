name = "cloudflare-imgbed"
main = "index.js"
compatibility_date = "2024-08-21"
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "../../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[images]
binding = "IMAGES"

[[d1_databases]]
binding = "img_d1"
database_name = "cloudflare-imgbed"
database_id = "xxxxxxxxxxxxxxxxx"

[[r2_buckets]]
binding = "img_r2"
bucket_name = "cloudflare-imgbed"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1